server:
  port: 8080

spring:
  application:
    name: music-api
  datasource:
    url: jdbc:postgresql://localhost:5432/musicdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: album-covers

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 300000 # 5 minutes in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-bucket
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: 10
              time: 1
              unit: minutes
